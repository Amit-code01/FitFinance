services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fitfinance
      MYSQL_USER: ${DB_USERNAME:-fitfinance}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fitfinance}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes: [fitfinance-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fitfinance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-fitfinance}
      DB_PASSWORD: ${DB_PASSWORD:-fitfinance}
      JWT_SECRET: ${JWT_SECRET:-replace-this-local-development-secret-key-32-bytes}
      CORS_ALLOWED_ORIGIN: http://localhost:4173
    depends_on:
      mysql: { condition: service_healthy }
    ports: ["8080:8080"]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    depends_on: [backend]
    ports: ["4173:80"]
volumes:
  fitfinance-data:
